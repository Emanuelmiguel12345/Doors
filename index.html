<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0f0b">
<title>DOORS · Conquistas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap">
<style>
@font-face{font-family:'doorsfont';src:url('https://static.wikitide.net/stackdwiki/c/ce/Doors-Regular.ttf') format('truetype');font-display:swap}
:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--ink:#1a0f0b;--wood:#27170f;--wood2:#3a241a;
--text:#f0e4d2;--dim:#b6a28a;--brass:#e2b455;--lamp:#ffc972;
--line:color-mix(in srgb,var(--text) 15%,transparent);
--bg:url("https://static.wikitide.net/stackdwiki/5/5a/DOORS_Site-background-dark.webp")}
*{box-sizing:border-box}
html{background:var(--ink);scroll-padding-top:60px}
body{margin:0;font:400 16px/1.5 Spectral,Georgia,serif;color:var(--text)}
body::before{content:'';position:fixed;inset:0;z-index:-2;background:var(--bg) center/cover;opacity:.35;filter:blur(6px)}
body::after{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 60% at 50% -5%,rgba(255,201,114,.14),transparent 62%),color-mix(in srgb,var(--ink) 86%,transparent)}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.doors-font{font-family:'doorsfont',Oswald,sans-serif;font-weight:400}
.background-clip-text {
    background-image: var(--gradient);
    background-clip: text;
    color: var(--color, transparent);
}
/* General */
.color-template_gold {
	--gradient: linear-gradient(180deg, #f7e5b4, #e8da32);
}
.color-template_knob {
	--gradient: linear-gradient(180deg, #fefcf2, #f1b99d, #ad6483);
}
.color-template_knobs-boost {
	--gradient: linear-gradient(180deg, #f8f1c7, #f2e296, #e7b086);
}
.color-template_stardust {
	--gradient: linear-gradient(180deg, #fdfce9, #f1e380, #e49b87, #cd7792);
	--stroke: #72354b;
}
.color-template_revive {
	--gradient: linear-gradient(180deg, #fef5ed, #d55161);
}
.color-template_robux {
	color: #fff;
}

/* Badge Colors */
.color-template_battle {
    --gradient: linear-gradient(180deg, #dde6ff 0%, #cbf6ff 24.9%, #ffffff 52.8%, #e6beff 77%, #553cba 100%);
}
.color-template_battlecool {
    --gradient: linear-gradient(180deg, #dde6ff 0%, #ffffff 16.1%, #70ffff 31.8%, #ffec58 46.9%, #ff93dd 68.3%, #553cba 100%);
}
.color-template_crucifix {
    --gradient: linear-gradient(180deg, #ffd7b7 0%, #a6b9e3 20.2%, #b2eaff 60%, #c89b8d 87.7%, #ffd7b7 100%);
}
.color-template_crucifixrare {
    --gradient: linear-gradient(180deg, #ffd7b7 0%, #a9f4ff 25.4%, #8eacff 61.4%, #f4b8ff 79.2%, #f4ca71 89.1%, #8d645a 100%);
}
.color-template_crucifixscary {
    --gradient: linear-gradient(180deg, #ffd7b7 0%, #a6b9e3 24.6%, #b2eaff 46%, #fdcaff 63%, #e28a8a 82.7%, #ffd7b7 100%);
}
.color-template_default {
    color: #b49a80;
}
.color-template_escape {
    --gradient: linear-gradient(180deg, #e5ffff, #87cbff);
}
.color-template_escapeblue {
    --gradient: linear-gradient(180deg, #b2c3ff 0%, #7494ff 60.9%, #5670e5 100%);
}
.color-template_escapeinsane {
    --gradient: linear-gradient(180deg, #66e3ff 0%, #7b61ff 16.3%, #db6790 37.4%, #fbe572 56.9%, #42ffb7 81.3%, #81beff 100%);
}
.color-template_escapeunique {
    --gradient: linear-gradient(180deg, #fff36f 0%, #dba3a6 58.8%, #b3a4ff 80.4%, #81beff 100%);
}
.color-template_glitch {
    --gradient: linear-gradient(180deg, #ff00fb 0%, #ff00fb 58.8%, #fff700 59.3%, #ffe90e 72.7%, #00f2ff 73.4%, #1cd8ff 86.7%, #e21cfb 87.5%, #ff00fb 100%);
}
.color-template_glitchpurple {
    --gradient: linear-gradient(180deg, #b264b9 0%, #ff8fff 27%, #943aa6 74.9%, #903f9e 100%);
}
.color-template_groupmember {
    --gradient: linear-gradient(180deg, #f4ffa9 0%, #eec37e 44.1%, #7caeff 100%);
}
.color-template_holiday {
    --gradient: linear-gradient(180deg, #ffa4a6 0%, #fffed3 38.8%, #b7eeff 68.5%, #b7eeff 87%, #b9ffa4 100%);
}
.color-template_holidaycool {
    --gradient: linear-gradient(180deg, #ffc5c6 0%, #db6790 19.6%, #e9b8f3 40.8%, #b7eeff 55.5%, #42ffb7 71.6%, #b9ffa4 100%);
}
.color-template_ranked {
    --gradient: linear-gradient(180deg, #dde6ff 0%, #a2c3ff 26.5%, #ffffff 52.8%, #ffd5f4 61.1%, #feffcd 75.8%, #ebccff 89.4%, #553cba 100%);
}
.color-template_rareencounter {
    --gradient: linear-gradient(180deg, #ff989a, #bb6aec);
}
.color-template_redyellow {
    --gradient: linear-gradient(180deg, #ffa2a2, #ffda85);
}
.color-template_rush {
    --gradient: linear-gradient(180deg, #7d97c7, #836efe);
}
.color-template_scary {
    --gradient: linear-gradient(180deg, #ffedab 0%, #ffb580 39.3%, #c46de1 85.3%, #9876ba 100%);
}
.color-template_scary2 {
    --gradient: linear-gradient(180deg, #ffe761 0%, #ff7530 40.8%, #d149e1 83.4%, #553cba 100%);
}
.color-template_shinyred {
    --gradient: linear-gradient(180deg, #ffffff 0%, #ffd6d6 42%, #ff6868 57.4%, #ff4141 100%);
}
.color-template_special {
    --gradient: linear-gradient(180deg, #f4ffa9 0%, #f1c5ff 30.4%, #b6eaf5 60.9%, #ff4e9e 100%);
}
.color-template_survive {
    --gradient: linear-gradient(180deg, #c7837a, #c76868);
}
.color-template_surviverare {
    --gradient: linear-gradient(180deg, #be97c7, #fe5d5d);
}
.color-template_thadventure {
    --gradient: linear-gradient(180deg, #fece92, #fe8c25);
}
.color-template_thhard {
    --gradient: linear-gradient(180deg, #ef7d69, #ef735d);
}
.color-template_thquest {
    --gradient: linear-gradient(180deg, #ffa6ea, #d0d3ff);
}
.color-template_thvoid {
    --gradient: linear-gradient(180deg, #fefefe, #4b4b4b);
}
.color-template_utg {
    --gradient: linear-gradient(180deg, #ffffff 0%, #f3feff 28.5%, #a5f6ff 49.1%, #8299ff 62.8%, #ed888e 81.3%, #ff6c6c 100%);
}
.color-template_unique {
    --gradient: linear-gradient(180deg, #f4ffa9, #ff8f63);
}
.color-template_vision {
    color: #32f84f;
}
.color-template_archives {
    --gradient: linear-gradient(135deg, #99b1ff 0%, #98d5cc 16.9%, #96ff90 26.3%, #89c7e3 35.4%, #85b4ff 51.5%, #8adac2 68.4%, #8eff86 74.8%, #8eff86 87.7%, #8396ff 100%);
}
.color-template_stairwell {
    --gradient: linear-gradient(135deg, #4b4b54 0%, #313136 4.15%, #545457 30.4%, #1d1d1d 69.1%, #afafaf 100%);
}

/* modifier colors */
.color-template_defaultm { color: #ffdebd; }
.color-template_player   { color: #ffdebd; }
.color-template_helpful1 { color: #f9ffb8; }
.color-template_helpful2 { color: #c0ffa9; }
.color-template_helpful3 { color: #abffd5; }
.color-template_helpful4 { color: #aae6ff; }
.color-template_danger0  { color: #ffbb93; }
.color-template_danger1  { color: #ffa093; }
.color-template_danger2  { color: #ff9294; }
.color-template_danger3  { color: #ff7386; }
.color-template_danger4  { color: #ff566f; }
.color-template_danger5  { color: #ff4b4e; }
.color-template_danger6  { color: #ff272b; }
.color-template_hide     { color: #ffa08f; }
.color-template_seek     { color: #ff6c6c; }
.color-template_figure   { color: #eb8472; }
.color-template_dupe     { color: #ffa0b8; }
.color-template_rushm    { color: #bfbbd4; }
.color-template_ambush   { color: #abf1c2; }
.color-template_eyes     { color: #c7bcff; }
.color-template_screech  { color: #bdc4d3; }
.color-template_timothy  { color: #9db394; }
.color-template_snare    { color: #a5b371; }
.color-template_halt     { color: #50ffd9; }
.color-template_giggle   { color: #bcb0aa; }
.color-template_curious  { color: #ffdc4f; }
.color-template_white    { color: #ffffff; }
.color-template_pink     { color: #ff86d9; }
.color-template_cool     { color: #ffb9f8; }
.color-template_purple   { color: #aa83ff; }

/* Misc */
.color-template_lua {
	color: #00007d;
	--stroke: #fff;
}
.color-template_css {
	color: #398fc6;
}



main{max-width:1120px;margin:0 auto;padding:0 clamp(14px,4vw,32px)}
.hero{display:flex;align-items:center;gap:clamp(20px,6vw,48px);padding:30px 4px 24px}
.door{--p:0;flex:none;width:clamp(96px,26vw,132px);display:grid;gap:7px;justify-items:center}
.lintel{font:600 13px/1 Oswald,sans-serif;letter-spacing:.06em;color:var(--brass);padding:5px 12px;border:1px solid color-mix(in srgb,var(--brass) 55%,transparent);border-radius:3px;background:var(--wood)}
.frame{position:relative;width:100%;aspect-ratio:3/4.6;perspective:640px;border:6px solid var(--wood2);border-bottom:0;border-radius:4px 4px 0 0;background:#120a07;overflow:hidden;box-shadow:0 0 calc(var(--p)*.5px) rgba(255,190,90,.5)}
.room{position:absolute;inset:0;background:radial-gradient(90% 70% at 30% 60%,#fff1c9,#ffbf63 45%,#8a4a1c);opacity:calc(.22 + var(--p)/130)}
.leaf{position:absolute;inset:0;transform-origin:0 50%;transform:rotateY(calc(var(--p)*.55deg));transition:transform 1.1s cubic-bezier(.2,.8,.2,1) .15s;background:linear-gradient(90deg,#5b3a28,#6d4731 60%,#4d3021);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.leaf::before,.leaf::after{content:'';position:absolute;left:14%;right:14%;border:2px solid rgba(0,0,0,.28);border-radius:2px;box-shadow:inset 0 0 8px rgba(0,0,0,.25)}
.leaf::before{top:9%;height:34%}.leaf::after{bottom:9%;height:40%}
.knob{position:absolute;right:9%;top:50%;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2b8,#c4902f 60%,#6b4a14);z-index:1}
.hero h1{margin:0 0 6px;font-size:clamp(1.7rem,6vw,2.5rem);line-height:1;letter-spacing:.03em;color:var(--brass)}
.count{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 .5em;margin:0}
.count b{font:600 clamp(3.6rem,15vw,6rem)/.95 Oswald,sans-serif;font-variant-numeric:tabular-nums}
.count span{font-size:1.1rem;color:var(--dim)}
.sec{margin-top:12px;max-width:340px;font-size:.92rem;color:var(--dim)}
.sbar{height:3px;margin-top:6px;background:var(--line)}.sbar i{display:block;height:100%;width:0;background:var(--brass);transition:width .6s ease}
.tools{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 18px}
.tools input{flex:1 1 220px;min-width:0;padding:10px 14px;background:var(--wood);border:1px solid var(--line);border-radius:3px}
.tools input::placeholder{color:var(--dim)}
.chip{font:500 14px/1 Oswald,sans-serif;padding:11px 14px;background:transparent;border:1px solid var(--line);border-radius:3px}
.chip[aria-pressed=true]{background:var(--brass);border-color:var(--brass);color:var(--ink)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;background:color-mix(in srgb,var(--ink) 84%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;display:flex;align-items:baseline;gap:6px;padding:14px 12px 11px;font:500 16px/1 Oswald,sans-serif;white-space:nowrap;background:none;border:0;border-bottom:2px solid transparent;color:var(--dim)}
.tabs button small{font:400 13px Spectral,serif}
.tabs button.on{color:var(--brass);border-bottom-color:var(--brass)}
.list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;column-gap:48px}
@media(min-width:960px){.list{grid-template-columns:1fr 1fr}}
.item{border-bottom:1px solid var(--line)}
.badge{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:clamp(12px,3vw,20px);padding:18px 6px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;transition:background .4s,box-shadow .4s}
.badge.got{background:linear-gradient(90deg,color-mix(in srgb,var(--lamp) 11%,transparent),transparent 65%);box-shadow:inset 3px 0 0 var(--brass)}
@media(hover:hover){.badge:not(.got):hover{background:color-mix(in srgb,var(--text) 5%,transparent)}}
.medal{position:relative;width:clamp(66px,18vw,90px);aspect-ratio:1;margin:8px;transition:filter .45s,opacity .45s}
.medal img,.medal .ph{display:block;width:100%;height:100%;border-radius:50%}
.medal .ph{display:grid;place-items:center;background:var(--wood2);font:600 32px Oswald,sans-serif}
.badge-border{position:absolute;inset:-8px;border-radius:50%;background-color:currentColor;background-image:var(--gradient);-webkit-mask:url("https://static.wikitide.net/doorswiki/8/81/BadgeBorder.svg") no-repeat center/contain;mask:url("https://static.wikitide.net/doorswiki/8/81/BadgeBorder.svg") no-repeat center/contain;pointer-events:none}
.badge-border-secret{-webkit-mask-image:url("https://static.wikitide.net/doorswiki/6/62/SecretBadgeBorder.svg");mask-image:url("https://static.wikitide.net/doorswiki/6/62/SecretBadgeBorder.svg")}
.badge:not(.got) .medal{filter:grayscale(1);opacity:.5}
.badge.got .medal{filter:drop-shadow(0 0 14px color-mix(in srgb,var(--lamp) 40%,transparent))}
.badge.pop .medal::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--lamp);animation:ring .8s ease-out forwards}
@keyframes ring{from{transform:scale(.92);opacity:.95}to{transform:scale(1.55);opacity:0}}
.body{min-width:0}
.t{margin:0;font:500 clamp(1.4rem,4.8vw,1.95rem)/1.05 Oswald,sans-serif}
.tags{display:inline-flex;gap:6px;margin-left:10px;vertical-align:middle}
.tag{font:500 12px/1 Oswald,sans-serif;padding:4px 7px;border:1px solid currentColor;border-radius:3px;color:var(--dim)}
.tag.sec{color:#c3a9ff}.tag.off{color:#f09a9a}
.q{margin:5px 0 0;font-style:italic;color:var(--dim)}
.d{margin:5px 0 0;max-width:62ch}.d.dim{color:var(--dim)}
.rw{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px}
.ri{display:inline-flex;align-items:center;gap:5px;font:600 1.1rem/1 Oswald,sans-serif}
.ri img{width:28px;height:28px;object-fit:contain}
.seal{width:30px;height:30px;display:grid;place-items:center;border:1.5px solid color-mix(in srgb,var(--text) 38%,transparent);border-radius:50%;transition:background .3s,border-color .3s}
.seal svg{width:16px;height:16px;fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s .08s}
.got .seal{background:var(--brass);border-color:var(--brass)}.got .seal svg{stroke-dashoffset:0}
.foot{display:flex;gap:8px;justify-content:flex-end;padding:0 6px 14px}
.info{font:500 13px/1 Oswald,sans-serif;padding:8px 12px;background:none;border:1px solid var(--line);border-radius:3px;color:var(--dim)}
.info::after{content:'+';margin-left:8px}.info[aria-expanded=true]{color:var(--brass);border-color:var(--brass)}.info[aria-expanded=true]::after{content:'\2212'}
.drawer{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.drawer.open{grid-template-rows:1fr}.drawer>div{overflow:hidden}
.box{margin:0 6px 16px;padding:14px 16px;background:var(--wood);border-left:2px solid var(--brass);font-size:.98rem;line-height:1.55;white-space:pre-line}
.box b,.box strong{display:block;font:500 15px/1.2 Oswald,sans-serif;color:var(--brass);margin:6px 0 2px}.box b{margin-top:0}
.empty{grid-column:1/-1;padding:56px 0;text-align:center;color:var(--dim)}
footer{padding:36px 0 44px;text-align:center;color:var(--dim);font-size:.85rem}
.backup{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
footer a{color:inherit}
.toast{position:fixed;left:50%;width:max-content;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:14px;max-width:calc(100% - 28px);padding:10px 12px 10px 16px;background:var(--wood2);border:1px solid var(--line);border-radius:3px;box-shadow:0 8px 28px rgba(0,0,0,.45);transform:translate(-50%,24px);opacity:0;pointer-events:none;transition:transform .3s,opacity .3s}
.toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast button{font:500 14px/1 Oswald,sans-serif;padding:8px 12px;background:var(--brass);color:var(--ink);border:0;border-radius:3px}
dialog{width:calc(100% - 32px);max-width:440px;padding:20px;background:var(--wood);color:var(--text);border:1px solid var(--line);border-radius:4px}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog p{margin:0 0 10px}dialog textarea{width:100%;height:96px;padding:8px;font:12px monospace;word-break:break-all;background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:3px}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.btns .go{background:var(--brass);border-color:var(--brass);color:var(--ink)}
@media(max-width:560px){.badge{grid-template-columns:auto 1fr auto;padding:14px 2px}.tags{display:flex;margin:6px 0 0}.hero{padding-top:22px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
/* Gerador de imagem da conquista */
.genbtn{color:var(--brass);border-color:color-mix(in srgb,var(--brass) 55%,transparent)}
.genbtn::after{content:none!important}
dialog.gen{width:min(1100px,calc(100% - 20px));max-width:none;max-height:calc(100dvh - 20px);padding:0;overflow:auto;border-color:color-mix(in srgb,var(--brass) 35%,transparent)}
.gen-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:var(--wood);border-bottom:1px solid var(--line)}
.gen-head h2{margin:0;font-size:1.7rem;line-height:1;color:var(--brass)}
.gen-body{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;padding:18px}
@media(min-width:861px){.gen-pv{position:sticky;top:78px;align-self:start}}
@media(max-width:860px){.gen-body{grid-template-columns:minmax(0,1fr)}}
.gen-stage{display:grid;place-items:center;min-height:180px;padding:10px;background:var(--ink);border:1px solid var(--line);border-radius:4px}
.gen-stage canvas{display:block;max-width:100%;max-height:min(62vh,620px);width:auto;height:auto;outline:1px solid var(--line);background:conic-gradient(#3a2a20 25%,#2d1f17 0 50%,#3a2a20 0 75%,#2d1f17 0) 0 0/20px 20px}
.gen-stage.busy canvas{opacity:.55}
.gen-dim{margin-top:8px;font:500 14px/1.3 Oswald,sans-serif;color:var(--dim);letter-spacing:.03em}
.gen-note{margin-top:10px;padding:10px 12px;font-size:.92rem;line-height:1.45;color:#f6d79a;background:color-mix(in srgb,var(--brass) 10%,transparent);border-left:2px solid var(--brass)}
.gen-note[hidden]{display:none}
.gen-note button{margin:8px 8px 0 0}
.gen-ctl{display:grid;gap:16px;align-content:start;min-width:0}
.gen-ctl fieldset{margin:0;padding:0;border:0;min-width:0}
.gen-ctl legend,.gen-ctl .lb{display:block;margin:0 0 6px;padding:0;font:500 13px/1 Oswald,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.gen select,.gen input[type=number],.gen input[type=text]{width:100%;min-width:0;padding:9px 10px;background:var(--ink);border:1px solid var(--line);border-radius:3px;color:var(--text)}
.gen input[type=range]{width:100%;accent-color:var(--brass)}
.gen-nav{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px}
.gen-nav .chip{padding:9px 14px}
.gen-cor{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.gen-cor .chip{display:flex;align-items:center;gap:9px;padding:10px;text-align:left;font-size:13px}
.cn{position:relative;flex:none;width:26px;height:17px;border:1.5px solid currentColor;border-radius:2px}
.cn::after{content:'';position:absolute;width:11px;height:6px;border-radius:1px;background:currentColor}
.cn.tl::after{top:2px;left:2px}.cn.tr::after{top:2px;right:2px}.cn.bl::after{bottom:2px;left:2px}.cn.br::after{bottom:2px;right:2px}
.gen-wh{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:8px}
.gen-wh[hidden]{display:none}

.gen-act{display:flex;gap:8px;flex-wrap:wrap}.gen-act .chip{flex:1 1 130px}
.gen .go{background:var(--brass);border-color:var(--brass);color:var(--ink)}
.gen-sub{display:flex;gap:8px;flex-wrap:wrap}

<script>
const B=[{"g":"General","t":"Welcome","a":"Enjoy your stay!","d":"Join for the first time.","u":"Join the game for the very first time on any account.","x":false,"h":false,"o":true,"i":"2127715318","m":"Welcome Badge.png","k":"Default"},{"g":"General","t":"Group Member","a":"You're one with the cool kids now!","d":"Join the LSPLASH group (and get a free revive)!","u":"Join the [LSPLASH|official LSPLASH group] on Roblox.","r":{"Revive":1},"x":false,"h":false,"o":true,"i":"2127965744","m":"Group Member Badge.png","k":"GroupMember"},{"g":"General","t":"Buddy System","a":"Everything's better with friends!","d":"Play a run with a friend.","u":"Die or win a run on any floor with somebody on your friends list.","x":false,"h":false,"o":true,"i":"2127964863","m":"Buddy System Badge.png","k":"Unique"},{"g":"General","t":"Back From The Dead","a":"I have unfinished business.","d":"Revive yourself.","u":"Use a revive or spend 40 Robux to revive.","x":false,"h":false,"o":true,"i":"2127965819","m":"Back From The Dead Badge.png","k":"Unique"},{"g":"General","t":"In Plain Sight","a":"Quick, behind that conveniently shaped lamp!","d":"Hide from an entity by staying out of sight.","u":"Hide from Rush or Ambush without being inside of a hiding spot.","f":"Achievement's description is a reference to one of Sans' lines from Undertale.","x":false,"h":true,"o":true,"i":"2133600691","m":"In Plain Sight Badge.png","k":"Unique"},{"g":"General","t":"One Of Many","a":"You're just getting started.","d":"Encounter your first death.","u":"Die to anything for the first time.","x":false,"h":false,"o":true,"i":"2127965852","m":"One Of Many Badge.png","k":"Default"},{"g":"General","t":"Picking Flowers","a":"Still got it!","d":"Have Grampy create a Lotus for you.","u":"Get 8 Lotus Petals found throughout The Outdoors and bring them to Grampy in The Mill.","r":{"Stardust":10},"x":false,"h":true,"o":true,"i":"2639935491453645","m":"Picking Flowers Badge.png","k":"Unique"},{"g":"General","t":"Rebirth","a":"Binded back together.","d":"Become reborn through a Lotus.","u":"Die and use any Lotus.","r":{"Stardust":20},"x":false,"h":true,"o":true,"i":"3037366308820165","m":"Rebirth Badge.png","k":"Unique"},{"g":"General","t":"Interconnected","a":"Enjoy, future me!","d":"Preserve an item in a Rift.","u":"Place a major item into any Rift.","x":false,"h":false,"o":true,"i":"2133601126","m":"Interconnected Badge.png","k":"RareEncounter"},{"g":"General","t":"Lost In Translation","a":"That is NOT what I put in there.","d":"Transform an item in a Rift.","u":"Put a Candle/Smoothie/Tip Jar in a Rift to transform it into a Moonlight Candle/Moonlight Float/Rift Jar.","x":false,"h":true,"o":true,"i":"2917258128600674","m":"Lost In Translation Badge.png","k":"RareEncounter"},{"g":"General","t":"Herb Of Viridis","a":"My heart is beating faster than before...","d":"Find and use a green herb.","u":"Find or buy a Skeleton Key, get to the Infirmary's subroom, find and unlock the skull-locked door, and use the Green Herb.","x":false,"h":false,"o":true,"i":"2133601772","m":"Herb Of Viridis Badge.png","k":"Unique"},{"g":"General","t":"Expert Technician","a":"I'm the one for the job.","d":"Complete the Hotel's breaker puzzle in under a minute.","u":"Complete the Hotel's circuit breaker puzzle in under 60 seconds.","x":false,"h":true,"o":true,"i":"2127966117","m":"Expert Technician Badge.png","k":"Unique"},{"g":"General","t":"Whoever Smelt It","a":"...Dealt it.","d":"Survive a Firedamp leak.","u":"Succesfully escape a Firedamp room.","x":false,"h":false,"o":true,"i":"2301707323598858","m":"Whoever Smelt It Badge.png","k":"Default"},{"g":"General","t":"Trespassing","a":"Sorry, sorry!","d":"Escape the Nest.","u":"Activate all the anchors in The Nest at Door 150 in The Mines and escape.","x":false,"h":true,"o":true,"i":"789272246312597","m":"Trespassing Badge.png","k":"Default"},{"g":"General","t":"Running Track","a":"Cart Ride From Seek (For Free Knobs)","d":"Escape Seek in the Mines.","u":"Reach door 149 of the Seek chase in The Mines.","f":"Achievement's description is a reference to old Roblox cart ride games, often named \"Cart Ride into _____\", and some other old Roblox games having \"for Free Robux\" near the end of the title.","x":false,"h":false,"o":true,"i":"2817127966247970","m":"Running Track Badge.png","k":"Default"},{"g":"General","t":"Down The Drain","a":"Down you go!","d":"Beat Seek in The Dam.","u":"Interact with all the Valves in The Dam at Door 200 in The Mines and escape to The Woods.","f":"Achievement's icon might be a reference to one of the scenes in Terminator where he shows a thumbs up while drowning in lava, or an elimination scene in the Polus map from Among Us (which seems to also reference the specific Terminator scene).","x":false,"h":false,"o":true,"i":"2791673925795977","m":"Down The Drain Badge.png","k":"Default"},{"g":"General","t":"Welcome Back","a":"Are you enjoying your stay?","d":"Join another day.","u":"Join the game atleast 24 hours after the first time you joined.","x":true,"h":false,"o":true,"i":"2127965664","m":"Welcome Back Badge.png","k":"Default"},{"g":"General","t":"Betrayal","a":"Dibs!","d":"Steal a hiding spot from someone right before they die.","u":"Another player must interact with your hiding spot while you are still in it and die to anything.","x":true,"h":false,"o":true,"i":"2127965803","m":"Betrayal Badge.png","k":"Unique"},{"g":"General","t":"Ten Of Many","a":"You'll get used to it.","d":"Encounter your tenth death.","u":"Die to anything for the 10th time.","x":true,"h":false,"o":true,"i":"2127965866","m":"Ten Of Many Badge.png","k":"Default"},{"g":"General","t":"Hundred Of Many","a":"That's more like it!","d":"Encounter your hundredth death.","u":"Die to anything for the 100th time.","x":true,"h":false,"o":true,"i":"2127965910","m":"Hundred Of Many Badge.png","k":"Default"},{"g":"General","t":"Feed the Birds","a":"They seem to have a liking on you now...","d":"Feed a Caw Bread!","u":"Bring a slice of Bread to The Outdoors, or get lucky and find it in The Outdoors, and drop it on the ground.","f":"Achievement's description is a reference to the video 'brother may I have some oats' where the second pig says: 'I believe they have taken a liking to me.'","x":true,"h":true,"o":true,"i":"136346866966212","m":"Feed the Birds Badge.png","k":"Unique"},{"g":"General","t":"Unpatched Dupe Glitch","a":"Quick! Before it's patched!","d":"Use a printer to scan and print an item.","u":"Use any non-essential items on a printer in The Archives.","x":false,"h":false,"o":true,"i":"3444580067085575","m":"Archives Placeholder Badge.png","k":"Archives"},{"g":"General","t":"Quick Purchase","a":"They're out of my favorite soda!","d":"Use some loose change to purchase a Shakelight.","u":"Use {{Gold|10}} on a Shakelight vending machine in The Archives.","x":false,"h":true,"o":true,"i":"736781288900578","m":"Archives Placeholder Badge.png","k":"Archives"},{"g":"General","t":"Paperclip Challenge","a":"Think I can buy a house with this?","d":"Trade with the hooded figure in The Stairwell.","u":"Reach Landing 99 in The Stairwell and exchange your scrap for gold.","x":false,"h":true,"o":true,"i":"1888162062641412","m":"Archives Placeholder Badge.png","k":"Stairwell"},{"g":"General","t":"Rage Room","a":"That worked?","d":"Successfully disable Noise.","u":"Push Noise's TV down some stairs in The Stairwell.","x":false,"h":true,"o":true,"i":"1382129123162095","m":"Archives Placeholder Badge.png","k":"Stairwell"},{"g":"General","t":"Fried Mushrooms","a":"Smells pretty good, actually.","d":"Use a Fire Alarm to incinerate Meld.","u":"Use and survive a Fire Alarm in The Stairwell.","x":false,"h":true,"o":true,"i":"1685221277396553","m":"Archives Placeholder Badge.png","k":"Stairwell"},{"g":"General","t":"REDACTED","a":"REDACTED","d":"Watch, and create a new entity.","u":"Bring the Disc from S-50 all the way to The Stairwell, find Noise's TV, and insert it.","x":true,"h":true,"o":true,"i":"4026679950625439","m":"Archives Placeholder Badge.png","k":"Stairwell"},{"g":"General","t":"Second Wind","a":"Down but not out.","d":"Survive damage that would normally be lethal to you.","u":"Use the overheal given by a Starlight Vial, Starlight Bottle, or Starlight Jug to survive lethal damage.","x":false,"h":false,"o":true,"i":"918145866740608","m":"Stairwell Placeholder Badge.png","k":"Unique"},{"g":"General","t":"Grindset","a":"So we're gonna go and do at least ten thousand.","d":"Grind Salvage into Scrap.","u":"Pick up a Depot Item and place it into a Depot.","x":false,"h":false,"o":true,"i":"3069200883215187","m":"Stairwell Placeholder Badge.png","k":"Stairwell"},{"g":"General","t":"Patience","a":"It's a virtue.","d":"Walk through the entire queue line in the Archives.","u":"Find Teller and walk trough the entire queue line in The Archives.","x":true,"h":true,"o":true,"i":"3012969357151434","m":"Archives Placeholder Badge.png","k":"Archives"},{"g":"General","t":"Mission Successful","a":"These things have never dried my hands.","d":"Flush a Toilet, turn on a Sink, and use an Air Dryer in succession.","u":"Flush a Toilet, turn on a Sink and use and Air Dryer in that specific order in a restroom in The Archives.","x":true,"h":true,"o":true,"i":"2358674839516376","m":"Archives Placeholder Badge.png","k":"Archives"},{"g":"General","t":"Dust To Dust","a":"Straight from the source!","d":"Obtain Stardust from a Scrapper.","u":"Place a Starlight Vial, Starlight Bottle, or Starlight Jug into a Depot in The Stairwell.","x":true,"h":true,"o":true,"i":"2188278828471393","m":"Stairwell Placeholder Badge.png","k":"Stairwell"},{"g":"General","t":"Garage Sale","a":"No refunds.","d":"Open a garage with a Garage Key.","u":"Purchase a Garage Key from The Stairwell's Pre-Run Shop or find one naturally. Find a garage door and unlock it with the garage key.","x":true,"h":false,"o":true,"i":"2639886537747907","m":"Stairwell Placeholder Badge.png","k":"Stairwell"},{"g":"General","t":"Clay World","a":"It was a little overdone anyway.","d":"Scrap a Ceramic Stem.","u":"Cook a Stem via the Fire Sprinklers, and then place it into a Depot.","x":true,"h":false,"o":true,"i":"1563321829226488","m":"Stairwell Placeholder Badge.png","k":"Stairwell"},{"g":"General","t":"QA Tester","a":"Get back to work! I said get back to work!","d":"Test stuff.","u":"Become a tester or developer for the game.","f":"Achievement's description references this meme ('''!NOT THE ORIGINAL MEME!''').","x":true,"h":true,"o":true,"i":"","m":"QA Tester Badge.png","k":"Special"},{"g":"General","t":"Content Creator","a":"Hello once again, audience!","d":"Be part of the DOORS Content Creator program. <3","u":"Become a content creator for the game by uploading media of DOORS on a social media platform.","x":true,"h":true,"o":true,"i":"","m":"Content Creator Badge.png","k":"Special"},{"g":"Entities","t":"Out Of My Way","a":"I'm walkin' here!","d":"Successfully survive Rush.","u":"Survive Rush by hiding in a hiding spot or in a safe spot.","f":"Achievement's description references this moment from the Midnight Cowboy.","x":false,"h":false,"o":true,"i":"2127965932","m":"Out Of My Way Badge.png","k":"Survive"},{"g":"Entities","t":"You Can Run","a":"But you can't um... um... uhh...","d":"Successfully run from Seek.","u":"Go through the 5 rooms in the Seek chase and survive.","x":false,"h":false,"o":true,"i":"2127965951","m":"You Can Run Badge.png","k":"Survive"},{"g":"Entities","t":"I See You","a":"Peek-a-boo!","d":"Dodge Screech's attack.","u":"When you hear a \"psst\", look around you until you see Screech. You must look at it and wait until it fully dissapears.","x":false,"h":false,"o":true,"i":"2127966064","m":"I See You Badge.png","k":"Survive"},{"g":"Entities","t":"Wrong Room","a":"Well this is awkward...","d":"Get duped by Dupe.","u":"Open a fake door spawned by Dupe.","x":false,"h":false,"o":true,"i":"2133599061","m":"Wrong Room Badge.png","k":"Survive"},{"g":"Entities","t":"Look At Me","a":"Last chance to look at me.","d":"Survive the Eyes.","u":"Survive a room with Eyes in it.","f":"Achievement's description is a reference to a line spoken by Gustavo Fring in a scene between him and rival Hector Salamanca from a Breaking Bad episode titled \"Face Off\".","x":false,"h":false,"o":true,"i":"2127966055","m":"Look at Me Badge.png","k":"Survive"},{"g":"Entities","t":"Eviction Notice","a":"And stay out!","d":"Get pushed out of a hiding spot by Hide.","u":"Stay inside of a hiding spot (which isn't in a subfloor or at Door 100 or Door 200) until you get pushed out of it by Hide.","x":false,"h":false,"o":true,"i":"2127965976","m":"Eviction Notice Badge.png","k":"Survive"},{"g":"Entities","t":"Dead Of Night","a":"Tick tock goes the clock...","d":"Survive Dread.","u":"Wait 10 minutes (or 1 hour while AFK) for Dread to spawn, then open the next door.","x":false,"h":false,"o":true,"i":"1653840661375503","m":"Dead Of Night Badge.png","k":"SurviveRare"},{"g":"Entities","t":"Rebound","a":"Coming back for seconds!","d":"Survive Ambush.","u":"Survive Ambush by constantly getting in and out of a hiding spot in The Hotel (or just hiding in a closet at Door 100 if Ambush somehow appears), or by hiding in a safe spot.","f":"Achievement's description references the \"Coming back for seconds\" idiom that is used to describe returning for another serving of food, usually because the first was enjoyed.","x":false,"h":false,"o":true,"i":"2127966009","m":"Rebound Badge.png","k":"SurviveRare"},{"g":"Entities","t":"Two Steps Forward","a":"And one step back.","d":"Survive Halt.","u":"Survive a room with Halt in it.","x":false,"h":false,"o":true,"i":"2127966037","m":"Two Steps Forward Badge.png","k":"SurviveRare"},{"g":"Entities","t":"Playtime","a":"Let's play!","d":"Give Sally a new toy.","u":"Encounter Sally and give it any item which isn't a crucifix.","f":"Achievement's name and description '''probably''' reference Playtime's phrase from the Baldi’s Basics in Education and Learning videogame.","x":false,"h":false,"o":true,"i":"3997925777959907","m":"Playtime Badge.png","k":"RareEncounter"},{"g":"Entities","t":"I Don't Believe My Eyes","a":"Dude, I swear there were like... ten million of them!","d":"Survive a swarm of Gloombats.","u":"Survive a room infested with Gloombats.","f":"Achievement's description and name reference the song ''Fireflies'' by Owl City, referencing the lyrics \"You would not believe your eyes, if ten million fireflies\".","x":false,"h":false,"o":true,"i":"1233383417912691","m":"I Don't Believe My Eyes Badge.png","k":"Survive"},{"g":"Entities","t":"Just A Prank","a":"It was just a prank, bro!","d":"Survive Giggle.","u":"Survive an attack from Giggle.","x":false,"h":false,"o":true,"i":"70842463964644","m":"Just A Prank Badge.png","k":"Survive"},{"g":"Entities","t":"Helping Hand","a":"You got a little something right... there.","d":"Knock Giggle off of another player's face.","u":"Remove a Giggle off of someone else's face.","x":false,"h":true,"o":true,"i":"1296279037717778","m":"Helping Hand Badge.png","k":"SurviveRare"},{"g":"Entities","t":"Trickshot","a":"Hooplah!","d":"Whack a Giggle and stun it with a Glowstick.","u":"Throw a Glowstick at a Giggle.","f":"Achievement is a reference to the SpongeBob episode \"Krusty Krab Training Video\", in which a brick is thrown at a fish who repeatedly says \"Hooplah!\"","x":false,"h":true,"o":true,"i":"779526452946763","m":"Trickshot Badge.png","k":"SurviveRare"},{"g":"Entities","t":"Trade Offer","a":"Do you accept?","d":"Barter with Louie.","u":"Encounter Louie in The Mines and give it any item by dropping it near its rat hole.","x":false,"h":true,"o":true,"i":"504590930650992","m":"Trade Offer Badge.png","k":"SurviveRare"},{"g":"Entities","t":"Sshh!","a":"Careful not to make a sound!","d":"Escape from the Library in the Hotel.","u":"Reach The Library at Door 50 in The Hotel and unlock the padlock's code at the exit door.","f":"Achievement's description references this song from the LazyTown.","x":false,"h":false,"o":true,"i":"2127966083","m":"Sshh! Badge.png","k":"Default"},{"g":"Entities","t":"Supporting Small Businesses","a":"Thank you, come again!","d":"Purchase an item from Jeff.","u":"Bring some Gold to Jeff Shop and buy an item.","f":"Achievement's description may be a reference to Apu Nahasapeemapetilon's \"Thank, you come again.\" Catchphrase from The Simpsons.","x":false,"h":false,"o":true,"i":"2133601267","m":"Supporting Small Businesses Badge.png","k":"Default"},{"g":"Entities","t":"Pls Donate","a":"Now I can go to college!","d":"Fill Jeff's tip jar.","u":"Bring ({{Gold|100}}) to Jeff Shop and fill up the tip jar.","f":"Achievement is a reference to another Roblox game of the same name and its description is a reference to the game UNDERTALE, where the protagonist is able to pay to vendor Temmies college (referred to as \"cool leg\" or \"colleg\" by Temmie).","x":false,"h":true,"o":true,"i":"2133601671","m":"Pls Donate Badge.png","k":"Unique"},{"g":"Entities","t":"Meet Timothy","a":"Hello there little spider!","d":"Encounter Timothy while looting.","u":"Open any containers in any main floor and have a 1 in 200 chance of Timothy jumping out of it. You can increase your chances of meeting it with the ''Itchy'' modifier.","f":"Achievement's icon is a reference to a joke between the developers and pre-release testers, where it was commonly requested that any drawers containing Timothy would be covered with webs, although this request always was declined and its description is a potential reference to an action in The Henry Stickmin Collection's 4th 'episode', Infiltrating the Airship, where during the Government Supported Private Investigator route, Henry attempts to spook a clan member with a tiny spider on a stick, but instead to scream or being scared and running, the clan member greeting it warmly, saying \"Oh, hello Mr. Spider.\" before Henry hitting him in the head with the stick being the member dazed and knocked out..","x":true,"h":false,"o":true,"i":"2127966127","m":"Meet Timothy Badge.png","k":"RareEncounter"},{"g":"Entities","t":"It Stares Back","a":"Guys, wait up!!!","d":"Encounter the Void.","u":"On a main floor, get left behind in a multiplayer run far enough to encounter Void.","x":true,"h":false,"o":true,"i":"2133601025","m":"It Stares Back Badge.png","k":"RareEncounter"},{"g":"Entities","t":"Meet Jack","a":"Ooga booga!","d":"Encounter Jack.","u":"Encounter Jack by hiding in a hiding spot in any main floor, having a 1 in 200 (0.5%) chance of it spawning, or by opening an door on any main floor, having a 1 in 2000 (0.05%) chance of it spawning behind it.","x":true,"h":false,"o":true,"i":"2127966139","m":"Meet Jack Badge.png","k":"RareEncounter"},{"g":"Entities","t":"Error","a":"Well that just happened.","d":"Encounter the Glitch.","u":"Fall into the void, experience a room generation error, pick up a Glitch Fragment, or get left behind in a multiplayer run in any subfloor.","x":true,"h":true,"o":true,"i":"2127966150","m":"Error Badge.png","k":"RareEncounter"},{"g":"Entities","t":"TRIAL & ERROR","a":"I... I think I'm seeing things.","d":"Encounter and survive an activated Glitch Fragment.","u":"Find and use a Glitch Fragment, then survive the glitched entity that spawns. You can increase the chances of finding a Glitch Fragment by encountering Glitch.","x":true,"h":true,"o":true,"i":"3994503755162324","m":"TRIAL & ERROR Badge.png","k":"RareEncounter"},{"g":"Entities","t":"Most Valuable Employee","a":"I hope I get a promotion!","d":"Successfully organize the Mail Room.","u":"Find and survive the Honcho encounter in The Archives.","x":false,"h":true,"o":true,"i":"2497010549297194","m":"Archives Placeholder Badge.png","k":"EscapeBlue"},{"g":"Entities","t":"Limitless Paper","a":"The Paper People's Personal Purgatory.","d":"Successfully survive Scribbles.","u":"Survive Scribbles by hiding in a hiding spot, hiding in a safe spot or by having enough health to tank the damage Scribbles giv ":"SO RETRO!","d":"Beat RETRO MODE [SURVIVE THE DRAKOBLOXXERS] (April Fools 2024)","x":true,"h":true,"o":false,"i":"1318507127292914","m":"Survive The Drakobloxxers Badge.png","k":"ShinyRed"},{"g":"Legacy","t":"Rock Bottom (Before HOTEL+)","a":"This was only obtainable before the HOTEL+ update!","d":"Escape The Hotel.","x":true,"h":true,"o":false,"i":"2127966163","m":"Rock Bottom Badge.png","k":"Escape"},{"g":"Legacy","t":"Detour (Before The Outdoors)","a":"This was only obtainable before The Great Outdoors update!","d":"Enter a subfloor. Receive their acknowledgement.","x":true,"h":true,"o":false,"i":"2133601870","m":"Detour Badge.png","k":"Unique"},{"g":"Legacy","t":"Roomy","a":"How gloomy!","d":"Enter The Rooms.","u":"Bring 2 Lockpicks and a Skeleton Key to the hidden enterance in Door 60.","x":true,"h":true,"o":false,"i":"2133601870","m":"Roomy Badge.png","k":"Unique"},{"g":"Legacy","t":"Back On Track","a":"That sucked... but hey, check out this cool flashlight!","d":"Escape The Rooms.","x":true,"h":true,"o":false,"i":"2133603021","m":"Back On Track Badge.png","k":"EscapeUnique"},{"g":"Legacy","t":"A-1000","a":"This was only obtainable before The Archives update!","d":"Reach the end of The Rooms.","x":true,"h":true,"o":false,"i":"2133603122","m":"A-1000 Badge.png","k":"EscapeInsane"},{"g":"Unlisted","t":"BLOXFEST: Double Feature","a":"TEMPORARY. WILL BE SHORTLY REMOVED!","d":"Escape Hotel & Mines with some restrictions.","u":"The easiest way to get this badge is to start with The Hotel. Loot until you have at least 300 gold. Get yourself to the Jeff Shop (around door 55) and buy the Skeleton Key. Then, continue to The Courtyard (door 89) and look around to find the Shears. In the next room, cut the vines on the door with the shears and unlock the door behind with the Skeleton Key. You'll get the first part of the badge here. (25 minutes)\\n\\nNow, you have two choices:\\n* Continue the run: Make your way through The Outdoors. Once you complete this subfloor, you'll get a shortcut to The Mines Jeff Shop (door 152). Note: In the Outdoors, only one player has to complete the floor. Everyone else will be revived in the Mines and can still earn the badge. (30-35 minutes)\\n* Return to the Lobby: Create an elevator for The Mines and survive the first 50–60 doors until you reach the Jeff Shop, including The Nest and the first Seek chase. (30-40 minutes)\\n\\nOnce you are at The Mines Jeff Shop (around door 155), continue until door 200, beat Seek in The Dam, and complete the floor. (20 minutes)\\n\\n=== Retries ===\\n* If you die in The Hotel, you can simply replay the floor.\\n* If you die in The Outdoors, return to the Lobby and create an elevator for either The Outdoors again or try beating The Mines from the beginning.\\n* If you die in The Mines, you can either retry the floor or return to the Lobby and try taking the shortcut to door 152 from The Outdoors.\\n\\n=== Recommendations ===\\n* Play with others! It is easier with a team.\\n* If you get stuck at any point, watching a walkthrough might be very helpful.\\n\\n=== Conditions ===\\n* Don't use any modifiers.\\n* Don't use revives.\\n* Don't use a lotus.\\n* Don't use any saves.\\n* Don't use any rifts.","f":"Achievement's name is most likely a reference to one of the Mr. \"Ant\" Tenna's lines in Deltarune.","x":true,"h":true,"o":false,"i":"1226198493522527","m":"BLOXFEST Double Feature Badge.png","k":"GlitchPurple"},{"g":"Unlisted","t":"Out Hot Eat The Food","a":"N/A","d":"N/A","u":"Unknown, likely not intended for the Access Granted update.","x":true,"h":true,"o":false,"i":"4137450828053422","m":"Stairwell Placeholder Badge.png","k":"Stairwell"},{"g":"Unlisted","t":"THE TAKEOVER: NOOB","a":"N/A","d":"Gain 500 points in a Battle Mode round.","x":true,"h":true,"o":false,"i":"1785779318159197","m":"THE TAKEOVER NOOB Badge.png","k":"Default"},{"g":"Unlisted","t":"THE TAKEOVER: PRO","a":"N/A","d":"Gain 1000 points in a Battle Mode round.","x":true,"h":true,"o":false,"i":"4 g.save();g.shadowColor='rgba(0,0,0,.55)';g.shadowBlur=26*u;g.shadowOffsetY=8*u;rr(g,x,y,cw,ch,R);g.fillStyle='#1c110c';g.fill();g.restore();
const bg=g.createLinearGradient(0,y,0,y+ch);bg.addColorStop(0,'rgba(50,32,23,.96)');bg.addColorStop(1,'rgba(22,13,9,.97)');
rr(g,x,y,cw,ch,R);g.fillStyle=bg;g.fill();
g.save();rr(g,x,y,cw,ch,R);g.clip();const gl=g.createRadialGradient(cx,cy,0,cx,cy,RING*1.7);gl.addColorStop(0,'rgba(255,201,114,.17)');gl.addColorStop(1,'rgba(255,201,114,0)');g.fillStyle=gl;g.fillRect(x,y,cw,ch);
g.fillStyle='rgba(255,255,255,.06)';g.fillRect(x+R,y,cw-2*R,Math.max(1,u));g.restore();
rr(g,x+u,y+u,cw-2*u,ch-2*u,R-u);g.lineWidth=2*u;g.strokeStyle='rgba(240,228,210,.17)';g.stroke();
/* medalha */
g.save();g.shadowColor='rgba(255,201,114,.35)';g.shadowBlur=18*u;g.beginPath();g.arc(cx,cy,MED/2,0,Math.PI*2);g.fillStyle='#3a241a';g.fill();g.restore();
g.save();g.beginPath();g.arc(cx,cy,MED/2,0,Math.PI*2);g.clip();
if(icon){const iw=icon.naturalWidth||MED,ih=icon.naturalHeight||MED,sc=Math.max(MED/iw,MED/ih);g.drawImage(icon,cx-iw*sc/2,cy-ih*sc/2,iw*sc,ih*sc)}
else{g.fillStyle='#3a241a';g.fillRect(cx-MED/2,cy-MED/2,MED,MED);g.font=DF(60*u);g.textAlign='center';g.textBaseline='middle';g.fillStyle=fillFor(g,t,cx-30*u,cy-30*u,60*u,60*u);g.fillText((b.t[0]||'?').toUpperCase(),cx,cy+2*u)}
g.restore();
{const s=Math.ceil(RING),rc=document.createElement('canvas');rc.width=rc.height=s;const r=rc.getContext('2d');
if(ringImg){r.drawImage(ringImg,0,0,s,s);r.globalCompositeOperation='source-in';r.fillStyle=fillFor(r,t,0,0,s,s);r.fillRect(0,0,s,s)}
else{r.lineWidth=s*.045;r.strokeStyle=fillFor(r,t,0,0,s,s);r.beginPath();r.arc(s/2,s/2,s/2-r.lineWidth/2,0,Math.PI*2);r.stroke();
if(b.x){r.setLineDash([s*.035,s*.035]);r.beginPath();r.arc(s/2,s/2,s/2-r.lineWidth*2.4,0,Math.PI*2);r.stroke()}}
g.drawImage(rc,cx-s/2,cy-s/2)}
/* textos */
let ty=y+(ch-th)/2;const tx=x+PAD+RING+GAP;g.textAlign='left';g.textBaseline='middle';g.lineJoin='round';
for(const bl of blocks){ty+=bl.before;
if(bl.rewards){const my=ty+bl.lh/2;let rx=tx;
for(const it of items){if(it.img){const iw=it.img.naturalWidth||IS,ih=it.img.naturalHeight||IS,sc=Math.min(IS/iw,IS/ih);g.drawImage(it.img,rx+(IS-iw*sc)/2,my-ih*sc/2,iw*sc,ih*sc);rx+=IS+(it.txt?8*u:0)}
if(it.txt){g.font=RF;g.lineWidth=3*u;const tk=tpl(it.k),tww=meas(RF,it.txt);g.strokeStyle=strokeFor(tk);g.strokeText(it.txt,rx,my);g.fillStyle=fillFor(g,tk,rx,my-14*u,tww,28*u);g.fillText(it.txt,rx,my);rx+=meas(RF,it.txt)}
rx+=20*u}
ty+=bl.lh;continue}
for(const l of bl.lines){const my=ty+bl.lh/2;g.font=bl.f;ls(bl.ls||0);
if(bl.title){g.lineWidth=Math.max(2,bl.sz*.09);g.strokeStyle=strokeFor(bl.paint);g.strokeText(l,tx,my)}
g.fillStyle=typeof bl.paint=='string'?bl.paint:fillFor(g,bl.paint,tx,my-bl.sz*.5,meas(bl.f,l,bl.ls),bl.sz);g.fillText(l,tx,my);ls(0);ty+=bl.lh}}
return{canvas:c,missing}}

/* janela */
let genList=[],genIdx=0,genTok=0,genT,dimTxt='',flT;
const curB=()=>genList[genIdx];
const saveG=()=>{try{const s={...G};delete s.label;localStorage.setItem(GK,JSON.stringify(s))}catch(e){}};
function flash(m){$('gdim').textContent=m;clearTimeout(flT);flT=setTimeout(()=>{$('gdim').textContent=dimTxt},3800)}
function openGen(id){genList=sorted(B.filter(vis));genIdx=genList.findIndex(b=>b.i==id);if(genIdx<0){genList=[BY[id]];genIdx=0}
$('gsel').innerHTML=genList.map((b,i)=>`<option value="${i}">${esc(b.t)}</option>`).join('');
paintGen();$('gen').showModal();schedGen()}
function paintGen(){const b=curB();if(!b)return;
$('gsel').value=genIdx;$('gres').value=G.res;$('gwh').hidden=G.res!='custom';
if(document.activeElement!=$('gcw'))$('gcw').value=G.cw;if(document.activeElement!=$('gch'))$('gch').value=G.ch;
$('gmode').value=G.mode;$('gbg').value=G.bg;$('gsize').value=G.size;$('gsizev').textContent=G.size+'%';
['d','a','r','u'].forEach(k=>$('g'+k).checked=!!G[k]);
if(document.activeElement!=$('glab'))$('glab').value=G.label;
$('gcor').querySelectorAll('[data-c]').forEach(e=>e.setAttribute('aria-pressed',e.dataset.c==G.corner));
$('gprev').disabled=genIdx<=0;$('gnext').disabled=genIdx>=genList.length-1;$('gicr').hidden=!custom[b.i]}
function schedGen(){clearTimeout(genT);$('gstage').classList.add('busy');genT=setTimeout(drawGen,50)}
async function drawGen(){const my=++genTok,b=curB();if(!b)return;await genFonts();if(my!=genTok)return;
const st=$('gstage'),W=G.cw,H=G.ch,dpr=Math.min(window.devicePixelRatio||1,2);
let rw=W,rh=H;if(G.mode=='frame'){const pw=Math.max(300,Math.min(W,1400,Math.round((st.clientWidth-20)*dpr)));rw=pw;rh=Math.round(H*pw/W)}
let res;try{res=await renderBadge(b,rw,rh,G)}catch(e){console.error(e);if(my==genTok){st.classList.remove('busy');flash('Erro ao desenhar: '+e.message)}return}
if(my!=genTok)return;
st.replaceChildren(res.canvas);st.classList.remove('busy');
const bgT=G.bg=='none'?'PNG transparente':G.bg=='green'?'PNG com fundo verde':'PNG com fundo preto';
dimTxt=(G.mode=='frame'?`${W} × ${H} px`:`Cartão recortado: ${res.canvas.width} × ${res.canvas.height} px`)+' · '+bgT;$('gdim').textContent=dimTxt;
const n=$('gnote');if(res.missing.includes('icon')){n.hidden=false;n.innerHTML='Não consegui carregar a imagem deste ícone com permissão para exportar (sem internet ou a wiki bloqueou). Escolha o arquivo em <b>Trocar ícone…</b>, arraste a imagem para a prévia ou cole com Ctrl+V.<br><button class="chip" type="button" id="gretry">Tentar de novo</button>'}else n.hidden=true}
async function genBlob(){await genFonts();const b=curB(),res=await renderBadge(b,G.cw,G.ch,G);const bl=await new Promise((ok,no)=>{try{res.canvas.toBlob(x=>x?ok(x):no(new Error('o navegador não gerou o PNG')),'image/png')}catch(e){no(e)}});return{bl,w:res.canvas.width,h:res.canvas.height,b}}
function setCustom(f){if(!f||!/^image\//.test(f.type))return;const id=curB().i,url=URL.createObjectURL(f),im=new Image();
im.onload=()=>{URL.revokeObjectURL(url);custom[id]=im;paintGen();schedGen()};im.onerror=()=>{URL.revokeObjectURL(url);flash('Esse arquivo não parece ser uma imagem.')};im.src=url}
function goGen(n){const i=clamp(genIdx+n,0,genList.length-1);if(i==genIdx)return;genIdx=i;paintGen();schedGen()}

const gctl=document.querySelector('.gen-ctl');
function readGen(e){const t=e.target,id=t.id;
if(id=='gsel')genIdx=+t.value;
else if(id=='gres'){G.res=t.value;if(t.value!='custom'){const p=t.value.split('x');G.cw=+p[0];G.ch=+p[1]}}
else if(id=='gcw'||id=='gch'){if(e.type!='change')return;G.res='custom';G.cw=+$('gcw').value;G.ch=+$('gch').value}
else if(id=='gmode')G.mode=t.value;else if(id=='gbg')G.bg=t.value;else if(id=='gsize')G.size=+t.value;
else if(id=='gd'||id=='ga'||id=='gr'||id=='gu')G[id[1]]=t.checked;
else if(id=='glab')G.label=t.value;
else return;
fixG();paintGen();saveG();schedGen()}
gctl.addEventListener('input',readGen);gctl.addEventListener('change',readGen);
$('gres').innerHTML=RES.map(r=>`<option value="${r[0]}x${r[1]}">${r[2]}</option>`).join('')+'<option value="custom">Personalizada…</option>';
$('gcor').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;G.corner=b.dataset.c;paintGen();saveG();schedGen()};
$('gprev').onclick=()=>goGen(-1);$('gnext').onclick=()=>goGen(1);
$('gx').onclick=()=>$('gen').close();
$('gen').addEventListener('click',e=>{if(e.target.id=='gen')$('gen').close()});
$('gen').addEventListener('close',()=>{genTok++;clearTimeout(genT)});
$('gen').addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea'))return;if(e.key=='ArrowRight')goGen(1);else if(e.key=='ArrowLeft')goGen(-1)});
addEventListener('resize',()=>{if($('gen').open)schedGen()});
$('gnote').addEventListener('click',e=>{if(e.target.id=='gretry'){retryImgs();setTimeout(schedGen,30)}});
$('gic').onclick=()=>$('gfile').click();
$('gfile').onchange=e=>{setCustom(e.target.files[0]);e.target.value=''};
$('gicr').onclick=()=>{delete custom[curB().i];paintGen();schedGen()};
$('gen').addEventListener('paste',e=>{const it=[...(e.clipboardData&&e.clipboardData.items||[])].find(i=>i.type.startsWith('image/'));if(it){e.preventDefault();setCustom(it.getAsFile())}});
$('gstage').ondragover=e=>e.preventDefault();
$('gstage').ondrop=e=>{e.preventDefault();setCustom(e.dataTransfer.files[0])};
$('gdl').onclick=async()=>{flash('Gerando…');try{const r=await genBlob(),a=document.createElement('a');a.href=URL.createObjectURL(r.bl);a.download=`doors-${slug(r.b.t)||'conquista'}-${r.w}x${r.h}.png`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);flash('Baixado: '+a.download)}catch(e){flash('Não consegui gerar o PNG: '+e.message)}};
$('gcp').onclick=async()=>{try{if(!navigator.clipboard||!window.ClipboardItem)throw new Error('sem suporte');flash('Copiando…');await navigator.clipboard.write([new ClipboardItem({'image/png':genBlob().then(r=>r.bl)})]);flash('Imagem copiada. Cole no seu editor de vídeo.')}catch(e){flash('Este navegador não deixou copiar. Use “Baixar PNG”.')}};
render();
</script></body></html>
